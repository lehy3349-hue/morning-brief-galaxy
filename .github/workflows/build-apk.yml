name: Build Morning Brief APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: morning-brief-debug-signing-v1
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK package and signing
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: MorningBrief-GalaxyFold-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish directly installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d '"' -f2)
          TAG="v$VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk MorningBrief.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Morning Brief $TAG" --notes "Blue Lion Morning Brief: general news headlines with commentator-style voice. Android test build." --latest
          fi
          gh release upload "$TAG" MorningBrief.apk --clobber
